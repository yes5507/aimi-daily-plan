<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#fff0f6 0%,#f3e8ff 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{max-width:400px;width:100%}
.card{background:#fff;border-radius:28px;padding:36px 28px 28px;
  box-shadow:0 16px 48px rgba(155,93,229,.2);text-align:center}
.icon{font-size:64px;margin-bottom:10px}
.title{font-size:28px;font-weight:800;color:#9b5de5;margin-bottom:6px}
.subtitle{font-size:14px;color:#9b8aab;margin-bottom:18px;line-height:1.6}
.tags{margin:0 0 22px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.tag{display:inline-block;background:linear-gradient(135deg,#ffd1e3,#e4cfff);
  color:#9b5de5;font-size:12px;font-weight:700;padding:5px 14px;border-radius:14px}
.btn{display:block;width:100%;padding:16px;border:none;border-radius:30px;
  background:linear-gradient(135deg,#ff6fa5,#9b5de5);color:#fff;font-size:17px;
  font-weight:700;text-decoration:none;margin-bottom:10px;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn-outline{background:#fff;color:#9b5de5;border:2px solid #9b5de5}
.features{display:flex;justify-content:space-around;margin:18px 0 22px;padding:14px 0;
  border-top:1px solid #f3e8ff;border-bottom:1px solid #f3e8ff}
.feat{text-align:center;flex:1}
.feat .e{font-size:26px;margin-bottom:4px}
.feat .t{font-size:11px;color:#9b8aab}
.tips{font-size:12px;color:#bbb;margin-top:14px;line-height:1.7;text-align:left}
.tips b{color:#9b5de5}
.qr-box{margin:18px 0 6px}
.qr-box img{width:140px;height:140px;border-radius:12px}
.qr-tip{font-size:12px;color:#9b8aab}
.foot{font-size:11px;color:#ddd;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="icon">✨</div>
    <div class="title">艾米日常计划</div>
    <div class="subtitle">每日打卡 · 积分兑换 · 养成好习惯</div>
    <div class="tags">
      <span class="tag">📚学习</span>
      <span class="tag">🎮娱乐</span>
      <span class="tag">⚽运动</span>
      <span class="tag">🎁兑换</span>
      <span class="tag">📊周报</span>
    </div>
    <div class="features">
      <div class="feat"><div class="e">✅</div><div class="t">每日打卡</div></div>
      <div class="feat"><div class="e">⭐</div><div class="t">积分累积</div></div>
      <div class="feat"><div class="e">🎁</div><div class="t">兑换奖励</div></div>
      <div class="feat"><div class="e">📊</div><div class="t">每周统计</div></div>
    </div>
    <a class="btn" href="index.html">打开工作台</a>
    <a class="btn btn-outline" href="aimi_qrcode.png">查看二维码</a>
    <div class="qr-box">
      <img src="aimi_qrcode.png" alt="扫码打开">
    </div>
    <div class="qr-tip">扫一扫，手机直接打开</div>
    <div class="tips">
      <b>📱 添加到桌面（像小程序一样）</b><br>
      · 苹果：Safari 打开 → 分享按钮 → 添加到主屏幕<br>
      · 安卓：Chrome 打开 → 菜单 → 添加到主屏幕<br><br>
      <b>💬 微信分享给好友</b><br>
      · 在微信里打开本链接<br>
      · 点右上角 ··· → 发送给朋友 / 分享到朋友圈<br><br>
      <b>🔗 直接发链接</b><br>
      · 复制本页地址发给好友即可
    </div>
    <div class="foot">艾米日常计划 · 积分打卡工作台</div>
  </div>
</div>
</body>
</html>
